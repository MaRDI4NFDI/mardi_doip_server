name: Build DOIP CLI Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

# One job per platform rather than a matrix. The three builds share no steps
# beyond checkout and install, and as a matrix a failure in one platform's build
# step aborted the whole job — so a broken Linux container also cost us the
# macOS binary and the artifact upload. Separate jobs fail independently.
env:
  PYTHON_VERSION: "3.12"

jobs:
  # =========================================================
  # WINDOWS
  # =========================================================
  build-windows:
    name: Build CLI (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv
        run: python -m venv venv
        shell: pwsh

      - name: Filter CLI deps
        run: |
          (Get-Content requirements.txt) |
            Where-Object { $_ -notmatch "mkdocs" } |
            Set-Content requirements.txt
        shell: pwsh

      - name: Install deps
        run: |
          venv\Scripts\Activate.ps1
          pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install -r requirements.txt
        shell: pwsh

      - name: Test
        run: |
          venv\Scripts\Activate.ps1
          pytest -vv
        shell: pwsh

      - name: Build binary
        run: |
          venv\Scripts\Activate.ps1
          pyinstaller `
            --onefile client_cli\main.py `
            --name mardi-doip-cli `
            --console `
            --add-data "VERSION;." `
            --hidden-import=anyio `
            --hidden-import=sniffio `
            --hidden-import=h11 `
            --clean `
            --log-level=WARN
          certutil -hashfile dist\mardi-doip-cli.exe SHA256 > dist\checksum.txt
        shell: pwsh

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mardi-doip-cli-windows-latest
          path: |
            dist/mardi-doip-cli*
            dist/checksum.txt
          if-no-files-found: error
          overwrite: true

  # =========================================================
  # LINUX
  # =========================================================
  build-linux:
    name: Build CLI (ubuntu-22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv
        run: python -m venv venv
        shell: bash

      - name: Filter CLI deps
        run: |
          sed -i.bak '/mkdocs/d' requirements.txt
          rm requirements.txt.bak
        shell: bash

      - name: Install deps
        run: |
          source venv/bin/activate
          pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install -r requirements.txt
        shell: bash

      - name: Test
        run: |
          source venv/bin/activate
          pytest -vv
        shell: bash

      # Build inside an old-GLIBC container rather than on the runner: PyInstaller
      # bundles the container's libpython, and a binary built against the Ubuntu
      # runner's GLIBC will not start on older distributions.
      #
      # AlmaLinux 8 gives GLIBC 2.28 and is supported until 2029, so the binary
      # runs on Debian 10+, Ubuntu 18.04+ and RHEL 8+.
      #
      # Two bases were tried and rejected. Debian Bullseye (GLIBC 2.31) was the
      # original choice, but Debian 11 reached end of life, its security suite's
      # Release file expired, and apt-get update started failing with exit
      # code 100. Bookworm builds cleanly but needs GLIBC 2.35 at runtime, which
      # is newer than several distributions still in use. PyPA's manylinux images
      # have the right GLIBC but ship a statically linked Python, which
      # PyInstaller refuses ("Python was built without a shared library").
      #
      # Note python3.12 -m PyInstaller: AlmaLinux's interpreter is versioned and
      # is not the default python3, so a bare `pyinstaller` would not resolve.
      - name: Build binary (AlmaLinux 8 container)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            almalinux:8 bash -c "
              dnf install -y python3.12 python3.12-pip python3.12-devel binutils && \
              python3.12 -m pip install --upgrade pip wheel setuptools pyinstaller --quiet && \
              grep -v mkdocs requirements.txt > /tmp/req_cli.txt && \
              python3.12 -m pip install -r /tmp/req_cli.txt --quiet && \
              python3.12 -m PyInstaller \
                --onefile client_cli/main.py \
                --name mardi-doip-cli \
                --console \
                --add-data "VERSION:." \
                --hidden-import=anyio \
                --hidden-import=sniffio \
                --hidden-import=h11 \
                --clean \
                --log-level=WARN && \
              sha256sum dist/mardi-doip-cli > dist/checksum.txt
            "
        shell: bash

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mardi-doip-cli-ubuntu-22.04
          path: |
            dist/mardi-doip-cli*
            dist/checksum.txt
          if-no-files-found: error
          overwrite: true

  # =========================================================
  # MACOS
  # =========================================================
  build-macos:
    name: Build CLI (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create venv
        run: python -m venv venv
        shell: bash

      - name: Filter CLI deps
        run: |
          sed -i.bak '/mkdocs/d' requirements.txt
          rm requirements.txt.bak
        shell: bash

      - name: Install deps
        run: |
          source venv/bin/activate
          pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install -r requirements.txt
        shell: bash

      - name: Test
        run: |
          source venv/bin/activate
          pytest -vv
        shell: bash

      - name: Build binary
        run: |
          source venv/bin/activate
          pyinstaller \
            --onefile client_cli/main.py \
            --name mardi-doip-cli \
            --console \
            --add-data "VERSION:." \
            --hidden-import=anyio \
            --hidden-import=sniffio \
            --hidden-import=h11 \
            --clean \
            --log-level=WARN
          sha256sum dist/mardi-doip-cli > dist/checksum.txt
        shell: bash

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mardi-doip-cli-macos-latest
          path: |
            dist/mardi-doip-cli*
            dist/checksum.txt
          if-no-files-found: error
          overwrite: true

  # -------------------------------------------------------
  # RELEASE JOB — runs only on version tags (v*)
  # -------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: mardi-doip-cli-windows-latest
          path: artifacts/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: mardi-doip-cli-ubuntu-22.04
          path: artifacts/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: mardi-doip-cli-macos-latest
          path: artifacts/macos

      - name: Rename binaries for release
        run: |
          mv artifacts/windows/mardi-doip-cli.exe artifacts/mardi-doip-cli-windows.exe
          mv artifacts/linux/mardi-doip-cli      artifacts/mardi-doip-cli-linux
          mv artifacts/macos/mardi-doip-cli      artifacts/mardi-doip-cli-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/mardi-doip-cli-windows.exe
            artifacts/mardi-doip-cli-linux
            artifacts/mardi-doip-cli-macos
